name: Validate Server

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm run check
      - name: Validate safe V2 ZIP
        run: |
          python - <<'PY'
          import zipfile
          p="public/bypass/furybbox1.zip"
          with zipfile.ZipFile(p) as z:
              bad=z.testzip()
              if bad:
                  raise SystemExit(f"Corrupt ZIP member: {bad}")
              print("furybbox1.zip OK:", z.namelist())
          PY
